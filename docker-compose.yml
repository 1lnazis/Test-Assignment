services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes
      POSTGRES_DB: quotes
    ports:
      # На хосте порт 5433, чтобы не конфликтовать с локальным Postgres на 5432.
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
