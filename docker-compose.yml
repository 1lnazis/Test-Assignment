services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quotes
      POSTGRES_PASSWORD: quotes
      POSTGRES_DB: quotes
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quotes -d quotes"]
      interval: 3s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      target: runtime
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://quotes:quotes@db:5432/quotes?sslmode=disable
      HTTP_ADDR: ":8080"
      CURRENCIES: ${CURRENCIES:-USD,EUR,MXN,RUB,KZT}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_COUNT: ${WORKER_COUNT:-1}
      MAX_ATTEMPTS: ${MAX_ATTEMPTS:-3}
      POLL_INTERVAL: ${POLL_INTERVAL:-1s}
      RETRY_BASE_DELAY: ${RETRY_BASE_DELAY:-1s}
      RETRY_MAX_DELAY: ${RETRY_MAX_DELAY:-30s}
      QUOTE_TIMEOUT: ${QUOTE_TIMEOUT:-5s}
      DB_TIMEOUT: ${DB_TIMEOUT:-3s}
      LEASE_DURATION: ${LEASE_DURATION:-30s}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: on-failure
    stop_grace_period: ${STOP_GRACE_PERIOD:-20s}

  test:
    profiles: [tools]
    build:
      context: .
      target: test
    depends_on:
      db:
        condition: service_healthy
    environment:
      TEST_DATABASE_URL: postgres://quotes:quotes@db:5432/quotes?sslmode=disable

volumes:
  pgdata:
